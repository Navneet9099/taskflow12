services:
  mysql-db:
    image: mysql:8.0
    container_name: taskflow-mysql
    restart: always
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root1234}
    ports:
      - "3307:3306"
    volumes:
      - taskflow_db_data:/var/lib/mysql
    networks:
      - taskflow-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root1234}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # container_name: taskflow-backend
    restart: always
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/taskflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root1234}
      JWT_SECRET: ${JWT_SECRET:-c2VjdXJlX2p3dF9zZWNyZXRfa2V5X2Zvcl90YXNrZmxvd19hcHAxMjM0NTY=}
      SERVER_PORT: 8081
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
    # ports:
    #   - "8081:8081"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - taskflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskflow-network

volumes:
  taskflow_db_data:

networks:
  taskflow-network:
    driver: bridge
